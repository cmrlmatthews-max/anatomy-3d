<style>
:root{
  color-scheme: dark light;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  /* UI sans: the system face (SF on iPhone) so it follows iOS Dynamic Type and keeps tabular figures. */
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  /* Display serif for titles and Latin names. */
  --serif: "Fraunces", ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
  /* Fluid type scale; every step is rem-based so it tracks the iPhone text-size setting. */
  --fs-2xs: clamp(.64rem, .60rem + .12vw, .72rem);
  --fs-xs:  clamp(.72rem, .68rem + .14vw, .80rem);
  --fs-sm:  clamp(.82rem, .77rem + .18vw, .92rem);
  --fs-md:  clamp(.94rem, .90rem + .20vw, 1.04rem);
  --fs-lg:  clamp(1.18rem, 1.08rem + .45vw, 1.42rem);
  --fs-xl:  clamp(1.55rem, 1.35rem + .9vw, 2rem);
  --ctl: 2.45rem;            /* control height, grows with Dynamic Type */
  --accent: #0a84ff;
  --bg1: #20283b; --bg2: #07090e;
  --text: #f6f7fb; --text2: rgba(238,242,252,.72); --text3: rgba(238,242,252,.46);
  --glass: rgba(26,30,42,.70); --glass-solid: #1b1e27; --lbl-bg: #1d2230;
  --glass-border: rgba(255,255,255,.12);
  --fill: rgba(255,255,255,.10); --fill-hi: rgba(255,255,255,.19);
  --track: rgba(255,255,255,.18);
  --shadow: 0 10px 34px rgba(0,0,0,.45);
  --peek-h: calc(3.9rem + var(--safe-b));
  --dock-bottom: max(8px, var(--safe-b));
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg1: #ffffff; --bg2: #d3dae8;
    --text: #12151c; --text2: rgba(18,21,28,.68); --text3: rgba(18,21,28,.44);
    --glass: rgba(255,255,255,.76); --glass-solid: #ffffff; --lbl-bg: #ffffff;
    --glass-border: rgba(0,0,0,.09);
    --fill: rgba(0,0,0,.06); --fill-hi: rgba(0,0,0,.11);
    --track: rgba(0,0,0,.14);
    --shadow: 0 10px 34px rgba(20,30,60,.16);
    --accent: #0071e3;
  }
}
:root[data-theme="light"]{
  --bg1: #ffffff; --bg2: #d3dae8; --text: #12151c; --text2: rgba(18,21,28,.68); --text3: rgba(18,21,28,.44);
  --glass: rgba(255,255,255,.76); --glass-solid: #ffffff; --lbl-bg: #ffffff; --glass-border: rgba(0,0,0,.09);
  --fill: rgba(0,0,0,.06); --fill-hi: rgba(0,0,0,.11); --track: rgba(0,0,0,.14); --shadow: 0 10px 34px rgba(20,30,60,.16); --accent: #0071e3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS Dynamic Type: in WebKit this sets the root size from the Text Size setting (17px by default). Other browsers ignore it. */
@supports (font: -apple-system-body){ html{font: -apple-system-body} }
html{font-family:var(--sans)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0d12}
body{
  position:fixed;inset:0;font-family:var(--sans);font-size:var(--fs-md);line-height:1.38;color:var(--text);
  font-variant-numeric:tabular-nums;
  background:radial-gradient(120% 90% at 50% 30%, var(--bg1) 0%, var(--bg2) 100%);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
@media (prefers-color-scheme: light){ html:not([data-theme="dark"]){background:#d3dae8} }   /* html only: the body gradient must stay on top */
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
svg.i{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl{position:absolute;left:0;top:0;max-width:15em;padding:.2em .6em;border-radius:.7em;font-size:var(--fs-2xs);font-weight:650;line-height:1.25;letter-spacing:.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);background:var(--lbl-bg);
  border:1px solid var(--glass-border);box-shadow:0 1px 4px rgba(0,0,0,.25);will-change:transform}
.lbl.sel{background:var(--accent);color:#fff;border-color:transparent;z-index:1}
.lbl i{display:inline-block;width:.5em;height:.5em;border-radius:50%;margin-right:.45em;vertical-align:.05em}

.scrim-top{position:fixed;left:0;right:0;top:0;height:calc(var(--safe-t) + 4px);pointer-events:none;z-index:3;
  background:linear-gradient(rgba(10,12,18,.5),rgba(10,12,18,0));display:none}
@media (prefers-color-scheme: light){ .scrim-top{display:block} }

.glass{
  background:var(--glass);border:.5px solid var(--glass-border);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);
}

/* ---------- top bar ---------- */
#topbar{position:fixed;z-index:10;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + 8px);
  display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;height:max(48px,calc(var(--ctl) + .4rem));border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;color:var(--text2)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:max(16px,var(--fs-md));
  -webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--text3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.round{width:max(48px,calc(var(--ctl) + .4rem));height:max(48px,calc(var(--ctl) + .4rem));border-radius:50%;display:grid;place-items:center;flex:none}
.round:active,.btn:active,.chip:active,.rail-btn:active,.rg:active{transform:scale(.95)}
.clear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}

/* region picker */
#regions{position:fixed;z-index:9;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + max(48px,calc(var(--ctl) + .4rem)) + 14px);
  border-radius:999px;padding:4px;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
#regions::-webkit-scrollbar{display:none}
.rg{flex:none;height:calc(var(--ctl) - .35rem);min-height:36px;padding:0 .8em;border-radius:999px;font-size:var(--fs-sm);font-weight:600;color:var(--text2);white-space:nowrap;transition:background .15s,color .15s,transform .12s}
.rg[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 1px 6px rgba(10,132,255,.45)}

#results{position:fixed;z-index:11;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + max(48px,calc(var(--ctl) + .4rem)) + 14px);
  max-height:min(60vh, calc(100dvh - var(--safe-t) - 90px));overflow:auto;border-radius:22px;padding:6px;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
.res{display:flex;align-items:center;gap:12px;width:100%;min-height:3.3rem;padding:6px 12px;border-radius:14px;text-align:left}
.res:active,.res.hl{background:var(--fill)}
.res .dot{width:.7em;height:.7em;border-radius:50%;flex:none}
.res .t{flex:1;min-width:0}
.res .n{font-family:var(--serif);font-weight:560;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .s{font-size:var(--fs-xs);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .s em{font-family:var(--serif);font-style:italic}
.res .off{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;font-variant-caps:all-small-caps;color:var(--text3);flex:none}
.empty{padding:22px 12px;text-align:center;color:var(--text2)}

/* ---------- right rail ---------- */
#rail{position:fixed;z-index:8;right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + max(48px,calc(var(--ctl) + .4rem)) + var(--ctl) + 34px);display:flex;flex-direction:column;gap:8px}
.rail-btn{width:3.3rem;height:3.3rem;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-2xs);font-weight:650;color:var(--text)}

/* ---------- dock ---------- */
#dock{position:fixed;z-index:9;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:var(--dock-bottom);
  max-width:640px;margin:0 auto;border-radius:26px;padding:2px 10px 10px;max-height:52dvh;overflow-y:auto;overflow-x:hidden;
  transition:bottom .35s cubic-bezier(.2,.8,.2,1),opacity .2s,transform .3s}
#dock.away{opacity:0;pointer-events:none;transform:translateY(24px)}
#dockToggle{display:flex;align-items:center;justify-content:center;width:100%;height:26px;color:var(--text3)}
#dockToggle svg{transition:transform .25s}
#dock.collapsed #dockToggle svg{transform:rotate(180deg)}
#dock.collapsed{padding-bottom:0;overflow:hidden}
#dock.collapsed .rows{display:none}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px}
.chips{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -10px;padding:0 10px;touch-action:pan-x;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
/* two rows, scrolling sideways: ~5 layer chips visible at once, so stripping the body down is quick */
.chips{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;gap:6px 8px;align-items:center}
.chips .chip{height:calc(var(--ctl) - .3rem);min-height:38px}
.chip.act{background:var(--fill);color:var(--text);font-weight:700;letter-spacing:.01em}
.chip.act svg{width:1rem;height:1rem}
.chip,.btn{height:var(--ctl);min-height:40px;border-radius:999px;padding:0 .95em;display:inline-flex;align-items:center;gap:.5em;flex:none;
  background:var(--fill);font-weight:600;font-size:var(--fs-sm);white-space:nowrap;transition:background .15s,transform .12s,color .15s}
.chip .dot{width:.72em;height:.72em;border-radius:50%;box-shadow:0 0 0 1px rgba(128,134,150,.55)}
.chip[aria-pressed="false"]{color:var(--text3)}
.chip[aria-pressed="false"] .dot{background:transparent !important;box-shadow:inset 0 0 0 1.5px var(--text3)}
.chip[aria-pressed="true"]{background:var(--fill-hi)}
.btn[aria-pressed="true"],.btn.primary{background:var(--accent);color:#fff}
.stepper{display:inline-flex;align-items:center;height:var(--ctl);min-height:40px;border-radius:999px;background:var(--fill);flex:none}
.stepper button{width:2.6rem;height:100%;display:grid;place-items:center;border-radius:999px}
.stepper button:disabled{opacity:.3}
.stepper .pl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:5.4rem;line-height:1.1}
.stepper .pl b{font-size:var(--fs-sm);font-weight:650}
.stepper .pl small{font-size:var(--fs-2xs);color:var(--text3);max-width:6.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expl{min-width:7rem;justify-content:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;background:transparent;touch-action:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat, var(--track)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pct{width:2.9em;text-align:right;font-size:var(--fs-sm);color:var(--text2)}
.sp{flex:1}

/* ---------- bottom sheet ---------- */
#sheet{position:fixed;z-index:12;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;height:700px;transform:translateY(110%);
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .38s cubic-bezier(.2,.85,.25,1);will-change:transform;pointer-events:none;
  background:var(--glass);border:.5px solid var(--glass-border);border-bottom:0;box-shadow:0 -8px 40px rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8)}
#sheet.open{pointer-events:auto}
#sheet.dragging{transition:none}
#sheetHead{flex:none;padding:6px max(12px, var(--safe-r)) 0 max(16px, var(--safe-l));touch-action:none;cursor:grab}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:0 auto 4px;opacity:.7}
.hrow{display:flex;align-items:center;gap:4px;min-height:3rem}
.hrow .tt{flex:1;min-width:0;padding:0 4px 0 0}
.hrow h2{margin:0;font-family:var(--serif);font-optical-sizing:auto;font-size:var(--fs-lg);font-weight:620;letter-spacing:-.012em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.latin{font-family:var(--serif);font-optical-sizing:auto;font-style:italic;font-weight:420;font-size:var(--fs-sm);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1em}
.nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2);flex:none}
.nav:active{background:var(--fill)}
#sheet:not([data-state="peek"]) h2,#sheet:not([data-state="peek"]) .latin{white-space:normal;overflow:visible;text-overflow:clip}
#sheet[data-state="peek"] .latin,#sheet[data-state="peek"] #sChips{display:none}
#sChips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:1.7rem;padding:0 .75em;border-radius:999px;background:var(--fill);font-size:var(--fs-xs);font-weight:620;letter-spacing:.01em;color:var(--text2)}
.tag .dot{width:.6em;height:.6em;border-radius:50%}
.tag.side{background:var(--accent);color:#fff}
#sheetBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  padding:4px max(18px, var(--safe-r)) calc(24px + var(--safe-b) + var(--hide,0px)) max(18px, var(--safe-l));-webkit-user-select:text;user-select:text}
.summary{font-size:var(--fs-md);line-height:1.5;margin:4px 0 14px;text-wrap:pretty}
.field{margin:0 0 14px}
.field h4{margin:0 0 .25em;font-size:var(--fs-xs);font-weight:700;letter-spacing:.11em;font-variant-caps:all-small-caps;text-transform:lowercase;color:var(--text3)}
.field p{margin:0;font-size:var(--fs-md)}
.field ul{margin:0;padding-left:1.15em}
.field li{margin:1px 0}
.clin{background:var(--fill);border-radius:16px;padding:12px 14px;margin:6px 0 14px}
.clin h4{color:var(--accent)}
.clin p{margin:0}
.soon{padding:14px;border-radius:14px;background:var(--fill);color:var(--text2);text-align:center;margin-top:6px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.mcard{width:100%;max-width:680px;height:calc(100dvh - var(--safe-t) - 36px);border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.85,.25,1);
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:.5px solid var(--glass-border);border-bottom:0}
.modal.open .mcard{transform:none}
#mInfo .mcard{height:auto;max-height:calc(100dvh - var(--safe-t) - 36px)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px max(10px, var(--safe-r)) 4px max(20px, var(--safe-l))}
.mhead h3{margin:0;font-family:var(--serif);font-size:var(--fs-xl);font-weight:620;letter-spacing:-.015em}
.mbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(20px, var(--safe-r)) calc(24px + var(--safe-b)) max(20px, var(--safe-l));-webkit-user-select:text;user-select:text}
.gsearch{margin:6px max(16px, var(--safe-r)) 8px max(16px, var(--safe-l));height:44px;border-radius:22px;background:var(--fill);display:flex;align-items:center;padding:0 14px;gap:8px;color:var(--text2)}
.gsearch input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:max(16px,var(--fs-md));-webkit-user-select:text;user-select:text}
.term{padding:10px 0;border-bottom:.5px solid var(--glass-border)}
.term b{display:block;font-family:var(--serif);font-size:var(--fs-md);font-weight:620}
.term span{color:var(--text2);font-size:var(--fs-sm)}
.mbody p{margin:0 0 12px}
.warn{padding:12px 14px;border-radius:14px;background:var(--fill);font-weight:600}
.small{font-size:var(--fs-xs);color:var(--text2)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px max(30px, var(--safe-r)) 30px max(30px, var(--safe-l));text-align:center;
  background:radial-gradient(120% 90% at 50% 30%, var(--bg1) 0%, var(--bg2) 100%);transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading h1{margin:0;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-.02em}
#loading .bar{width:min(260px,70vw);height:6px;border-radius:3px;background:var(--track);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s}
#loading .bar.ind i{width:35%;animation:ind 1.3s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
#loadMsg{color:var(--text2);font-size:var(--fs-sm);min-height:1.4em}
#loadPct{font-size:var(--fs-lg);font-weight:600;letter-spacing:.01em;min-height:1.3em}
#loadErr{max-width:320px}
#loadErr h1{font-size:var(--fs-lg)}
#loadErr p{color:var(--text2);margin:8px 0 14px}
#loadErr .btn{margin:0 auto}
.fig{width:min(150px,38vw);height:auto;color:var(--accent);overflow:visible}
.fig .track{fill:none;stroke:var(--track);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig .fillp{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig .draw{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.55;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 4.2s ease-in-out infinite}
.fig .scan{stroke:currentColor;stroke-width:.8;opacity:.5;animation:scan 3.6s ease-in-out infinite alternate}

<script type="module" id="main">
import * as THREE from 'three';

import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = (s, r = document) => r.querySelector(s);

const clamp = THREE.MathUtils.clamp;

/* ------------------------------------------------------------------ constants */
const TYPE_COLOR = { bone: '#efe3bf', cartilage: '#a8d2f0', ligament: '#e4dfd0', muscle: '#a4182a', nerve: '#ffd400', cns: '#e3b0b6', artery: '#e0202e', vein: '#1f55d6', organ: '#f08aa0' };

const LAYER_COLOR = { bone: '#efe3bf', ligament: '#e4dfd0', cns: '#e3b0b6', organ: '#f08aa0', nerve: '#ffd400', artery: '#e0202e', vein: '#1f55d6',
  muscle_deep: '#700c1c', muscle_mid: '#8c1022', muscle_superficial: '#a4182a', tendon: '#eef2f9' };
// Outer -> inner. The peel stepper hides these in order; chips follow the same order.
const PEEL_ORDER = ['muscle_superficial', 'muscle_mid', 'muscle_deep', 'vein', 'artery', 'nerve', 'ligament', 'organ'];
const CHIP_ORDER = ['muscle_superficial', 'muscle_mid', 'muscle_deep', 'tendon', 'vein', 'artery', 'nerve', 'organ', 'ligament', 'cns', 'bone'];
const EXPLODE_K = 1.0;
const MAX_LABELS = 20;

// Colour classes = glTF material names. [colour, roughness]. Saturated atlas palette.
const CLS = {
  Bone: [0xefe3bf, .52], Tooth: [0xfbfaf4, .28], Cartilage: [0xa8d2f0, .38], Ligament: [0xe9e4d4, .34], Tendon: [0xeef2f9, .3],
  Muscle_sup: [0xa4182a, .42], Muscle_mid: [0x8c1022, .42], Muscle_deep: [0x700c1c, .42], Muscle: [0x9a1426, .42],
  Nerve: [0xffd400, .38], Brain: [0xd9a0a8, .45], SpinalCord: [0xf4e4a0, .45],
  Artery: [0xe0202e, .3], Vein: [0x1f55d6, .3], Heart: [0x8e0f1c, .36],
  Organ_lung: [0xf08aa0, .4], Organ_airway: [0xd9ecf7, .35], Organ_liver: [0x6b2a1a, .34], Organ_gut: [0xf3a083, .38],
  Organ_stomach: [0xee8aa0, .36], Organ_kidney: [0x7a1630, .34], Organ_bladder: [0xf6e27a, .36], Organ_spleen: [0x7e3f8f, .36],
  Organ_pancreas: [0xd9b46a, .4], Organ_gland: [0xf08a24, .4], Organ_genital: [0xcc7aa6, .4], Organ_eye: [0xfbfbfb, .22],
  Organ_ear: [0xd9a77a, .45], Organ_tongue: [0xe5516b, .38], Organ_other: [0xc98a96, .42],
};
const TYPE_DEFAULT_CLS = { bone: 'Bone', cartilage: 'Cartilage', ligament: 'Ligament', muscle: 'Muscle', nerve: 'Nerve', cns: 'Brain', artery: 'Artery', vein: 'Vein', organ: 'Organ_other' };
const MUSCLE_VARIANT = { muscle_superficial: 'Muscle_sup', muscle_mid: 'Muscle_mid', muscle_deep: 'Muscle_deep' };

/* ------------------------------------------------------------------ state */
const S = {
  layers: {}, tendons: true, region: 'all', labels: false, sel: null, explode: 0, explodeTarget: 0,
};
let DATA = null;                 // parts.json
let CARDS = {}, GLOSSARY = [];   // cards.json
let parts = [];                  // built parts
let cardIdx = new Map();         // card key -> { key, parts[], card, name, latin, ... }
let regionName = new Map(), layerName = new Map();
let pickList = null;

/* ------------------------------------------------------------------ loading UI */
const loadingEl = $('#loading'), loadBar = $('#loadBar'), loadFill = $('#loadFill'), loadMsg = $('#loadMsg'), loadPct = $('#loadPct'), figRect = $('#figRect');
function setProgress(frac, msg, pctText) {
  if (msg != null) loadMsg.textContent = msg;
  if (pctText != null) loadPct.textContent = pctText;
  if (frac == null) { loadBar.classList.add('ind'); return; }
  loadBar.classList.remove('ind'); const f = clamp(frac, 0, 1);

}
function fatal(msg) {

  loadBar.hidden = true; loadMsg.hidden = true; loadPct.hidden = true; $('#loadErr').hidden = false;
  if (msg) $('#loadErrMsg').textContent = msg;
}
window.__fatal = fatal;

/* ------------------------------------------------------------------ renderer / scene */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {

}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 14);
scene.add(camera);
scene.matrixWorldAutoUpdate = false;   // static scene: only the camera (and its lights) and the exploding body move; see frame() / refreshWorld()
scene.environmentIntensity = 0.42;
// soft studio reflections so the slightly glossy materials read as forms. Built at boot and again after a WebGL context restore
// (the render target's contents are lost with the context).
let envRT = null;
function buildEnv(afterLoss) {

  const rt = pm.fromScene(new RoomEnvironment(), 0.04);
  const old = envRT; envRT = rt;

  // to this context"); otherwise release it.
  if (old && !afterLoss) old.dispose();

}
scene.add(new THREE.HemisphereLight(0xffffff, 0x7d86a0, 0.35));
// key + fill + rim, all attached to the camera so the model is always lit from the viewer's side
const key = new THREE.DirectionalLight(0xfff4e6, 2.3);
key.position.set(1.3, 1.6, 1.8); key.target.position.set(0, 0, -3);
const fillL = new THREE.DirectionalLight(0xbfd0ff, 0.9);
fillL.position.set(-1.8, -.3, 1.2); fillL.target.position.set(0, 0, -3);
const rim = new THREE.DirectionalLight(0xdfe9ff, 2.2);
rim.position.set(.9, 1.4, -6); rim.target.position.set(0, 0, -3);
camera.add(key, key.target, fillL, fillL.target, rim, rim.target);
scene.updateMatrixWorld(true);   // once: the hemisphere light's direction comes from its world matrix
const body = new THREE.Group(); scene.add(body); body.matrixWorldAutoUpdate = false;   // world matrices only change on explode (refreshWorld)

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.085;
controls.rotateSpeed = .85; controls.zoomSpeed = .9; controls.panSpeed = .9;
controls.screenSpacePanning = true; controls.minDistance = 0.08; controls.maxDistance = 6;
controls.addEventListener('change', requestRender);
controls.addEventListener('start', () => cancelCameraTween());

let W = innerWidth, H = innerHeight;
let viewShift = 0;     // constant projection offset (px) so the orbit centre sits in the free area between top bar and dock

function applyTheme() {
  const d = isDark();
  renderer.toneMappingExposure = d ? 1.0 : .95;
  for (const [k, m] of ghostMats) setGhostColor(m, k);
  for (const m of ghostMats.values()) m.opacity = d ? .12 : .2;
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = d ? '#0b0d12' : '#e9edf5';
  requestRender();
}
darkMQ.addEventListener('change', () => applyTheme());

/* ------------------------------------------------------------------ materials: one per colour class and state, never per mesh */
const baseMats = new Map(), selMats = new Map(), ghostMats = new Map();
const _c = new THREE.Color(), _hsl = {};
function clsDef(c) { return CLS[c] || CLS.Organ_other; }
function getBase(c) {
  let m = baseMats.get(c); if (m) return m;
  const [col, r] = clsDef(c);
  m = new THREE.MeshStandardMaterial({ color: col, roughness: r, metalness: 0.02, side: THREE.DoubleSide });
  m.name = c; baseMats.set(c, m); return m;
}
function getSel(c) {
  let m = selMats.get(c); if (m) return m;
  const [col, r] = clsDef(c);
  _c.setHex(col); _c.getHSL(_hsl);
  const boosted = new THREE.Color().setHSL(_hsl.h, Math.min(1, _hsl.s * 1.18 + .08), clamp(_hsl.l * 1.04 + .015, 0, .9));
  m = new THREE.MeshStandardMaterial({ color: boosted, roughness: Math.max(.2, r - .06), metalness: 0.02, side: THREE.DoubleSide, emissive: boosted.clone(), emissiveIntensity: .18 });
  m.name = c + '-sel'; selMats.set(c, m); return m;
}
function setGhostColor(m, c) {
  const [col] = clsDef(c);
  _c.setHex(col); _c.getHSL(_hsl);
  if (isDark()) m.color.setHSL(_hsl.h, _hsl.s * .22, .78);      // pale, desaturated, see-through on dark
  else m.color.setHSL(_hsl.h, _hsl.s * .3, .36);                 // soft slate on light
}
// Merged-bucket materials get a tiny vertex-shader hook: position += aExp * uExplode, so the whole explode runs on the GPU.
const uExpl = { value: 0 };
function withExplode(m) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uExplode = uExpl;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 aExp;\nuniform float uExplode;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += aExp * uExplode;');
  };

}
const mBaseMats = new Map();
function getMBase(c) {
  let m = mBaseMats.get(c); if (m) return m;
  const [col, r] = clsDef(c);
  m = withExplode(new THREE.MeshStandardMaterial({ color: col, roughness: r, metalness: 0.02, side: THREE.DoubleSide }));
  m.name = c + '-m'; mBaseMats.set(c, m); return m;
}
function getGhost(c) {
  let m = ghostMats.get(c); if (m) return m;
  const [, r] = clsDef(c);
  m = withExplode(new THREE.MeshStandardMaterial({ roughness: Math.max(.5, r), metalness: 0, transparent: true, opacity: isDark() ? .12 : .2, depthWrite: false, side: THREE.FrontSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 }));
  setGhostColor(m, c); m.name = c + '-ghost'; ghostMats.set(c, m); return m;
}

/* ------------------------------------------------------------------ helpers: names */
const cleanName = s => String(s || '').replace(/\.(r|l|g)$/i, '').trim();
const toList = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);
const fmt = v => (v && typeof v === 'object') ? (v.name || v.label || v.text || JSON.stringify(v)) : String(v);
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ------------------------------------------------------------------ render loop */
let raf = 0, lastT = 0, tweens = [], cameraTween = null, pulseT0 = -1e9;

function tween(dur, fn, done) {

  const t = { t0: performance.now(), dur, fn, done, dead: false };
  tweens.push(t); requestRender(); return t;
}
function cancelCameraTween() {
  const t = cameraTween; cameraTween = null;
  if (!t || t.dead) return;
  t.dead = true;
  const i = tweens.indexOf(t); if (i >= 0) tweens.splice(i, 1);
}
const sheetEl = $('#sheet');
let offs = null, basePos = null;     // Float32Arrays, 3 per part
const _o = new THREE.Vector3();

function applyExplode() {
  const t = S.explode * EXPLODE_K;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], j = i * 3;
    const e = p.node.matrix.elements;

  }
  uExpl.value = t; worldDirty = true;
  if (S.sel) refreshWorld();
}
function applyViewOffset() {

  else camera.setViewOffset(W, H, 0, viewShift, W, H);
}
function partOffset(p, t, out) {
  const i = p.i * 3; const k = t * EXPLODE_K;

}

function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - (lastT || now)) / 1000 || .016); lastT = now;
  let busy = false;
  const dE = S.explodeTarget - S.explode;
  if (Math.abs(dE) > 0.0004) {
    S.explode = reduceMotion ? S.explodeTarget : S.explode + dE * (1 - Math.exp(-dt * 10));
    if (Math.abs(S.explodeTarget - S.explode) < 0.0006) S.explode = S.explodeTarget;
    applyExplode(); syncExplodeUI(); busy = true;
  }
  if (tweens.length) {
    const cur = tweens; tweens = [];
    for (const tw of cur) {
      if (tw.dead) continue;
      const k = tw.dur <= 0 ? 1 : clamp((now - tw.t0) / tw.dur, 0, 1);
      tw.fn(ease(k));
      if (k < 1) { if (!tw.dead) tweens.push(tw); }
      else { if (cameraTween === tw) cameraTween = null; tw.dead = true; if (tw.done) tw.done(); }
    }
    busy = true;
  }
  // brief, gentle emissive pulse on the selection (then it settles) so we do not render continuously
  if (S.sel) {
    const t = now - pulseT0;
    let v = .17;
    if (t < 2600 && !reduceMotion) { v = .17 + .15 * Math.sin(t / 1300 * Math.PI * 2) * (1 - t / 2600); busy = true; }
    for (const m of selMats.values()) m.emissiveIntensity = v;

  camera.updateMatrixWorld();   // scene.matrixWorldAutoUpdate is off, so the camera (and the lights on it) is updated here
  renderer.render(scene, camera);
  if (S.labels) updateLabels();

}

function onResize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  measureUI(); layoutSheet(false); computeShift(); applyViewOffset(); requestRender();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { requestRender(); requestAnimationFrame(requestRender); } });
addEventListener('pageshow', () => requestRender());
let lostTimer = 0, lostPanel = false;
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  clearTimeout(lostTimer);
  lostTimer = setTimeout(() => { lostPanel = true; fatal('Graphics were interrupted and did not come back. Try again to reload the app.'); }, 5000);
});
renderer.domElement.addEventListener('webglcontextrestored', () => {
  clearTimeout(lostTimer);
  if (lostPanel) { lostPanel = false; $('#loadErr').hidden = true; loadingEl.classList.add('done'); loadingEl.style.display = 'none'; }
  try { buildEnv(true); } catch (err) { console.error(err); }
  requestRender(); requestAnimationFrame(requestRender);

(function sheetGestures() {

  if (e.key === 'Escape') { closeResults(true); qIn.blur(); }

qClear.addEventListener('click', () => { closeResults(true); qIn.focus(); });
document.addEventListener('pointerdown', e => {
  if (!resultsEl.hidden && !e.target.closest('#results') && !e.target.closest('#topbar')) { resultsEl.hidden = true; }
});

/* ------------------------------------------------------------------ modals: glossary + info */
function openModal(id) { const m = $(id); m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); }
function closeModal(m) { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); }
$$('.modal').forEach(m => {
  m.addEventListener('pointerdown', e => { if (e.target === m) closeModal(m); });
  $$('[data-close]', m).forEach(b => b.addEventListener('click', () => closeModal(m)));
});
function renderGlossary() {
  const list = $('#gList'); list.textContent = '';
  if (!GLOSSARY.length) { list.append(el('div', 'empty', 'No terms yet')); return; }
  const q = norm($('#gq').value);
  const sorted = GLOSSARY.slice().sort((a, b) => String(a.term).localeCompare(String(b.term)));
  const shown = q ? sorted.filter(t => norm(t.term).includes(q) || norm(t.def).includes(q)) : sorted;
  if (!shown.length) { list.append(el('div', 'empty', 'No matching terms')); return; }
  for (const t of shown) { const d = el('div', 'term'); d.append(el('b', null, t.term), el('span', null, t.def)); list.append(d); }
}
$('#btnGloss').addEventListener('click', () => { renderGlossary(); openModal('#mGloss'); });
$('#gq').addEventListener('input', renderGlossary);
function renderInfo() {
  const b = $('#infoBody'); b.textContent = '';
  b.append(el('p', null, 'Anatomy 3D: an interactive 3D atlas of the whole human body with bones, joints, muscles, nerves, vessels and organs.'));
  const cr = el('p'); cr.append(el('b', null, 'Credits')); cr.append(document.createElement('br'));
  cr.append(document.createTextNode((DATA && DATA.credit) || 'Credits unavailable.')); b.append(cr);
  b.append(el('div', 'warn', 'For study only. Not for clinical use.'));
  const meta = el('p', 'small'); meta.style.marginTop = '14px';
  meta.textContent = 'Tap a structure to isolate it; tap empty space to restore. Drag to rotate, pinch to zoom, two fingers to pan. Add to Home Screen for the full-screen app.';
  b.append(meta);
}
$('#btnInfo').addEventListener('click', () => { renderInfo(); openModal('#mInfo'); });

/* ------------------------------------------------------------------ boot */
// The service worker is registered only once boot has finished, so its precache never competes with the first model download.
let bootDone = false, swRegistered = false;
function reg() {
  if (swRegistered || !bootDone || document.readyState !== 'complete') return;
  if (!('serviceWorker' in navigator && /^https?:$/.test(location.protocol))) return;
  swRegistered = true;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
addEventListener('load', reg);
(async function boot() {
  try {
    W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    measureUI(); layoutSheet(false);
    const t0 = performance.now();
    buildEnv();
    const gltfs = await loadAll();
    const n = buildParts(gltfs);
    buildMerged();
    peelOrder = PEEL_ORDER.filter(l => (DATA.layers || []).some(x => x.id === l));
    for (const l of DATA.layers || []) S.layers[l.id] = true;
    buildRegions(); buildChips(); applyVisibility(); applyAppearance(); updatePeel(); syncExplodeUI(); applyTheme();
    dockExpandedH = dock.offsetHeight || dockExpandedH;
    computeShift();
    // initial framing: whole body, front view, inside the free area
    const g = fitBox(boxOfParts(parts, 0), new THREE.Vector3(0, .05, 1), bottomOccupied());
    camera.position.copy(g.target).addScaledVector(g.dir, g.dist); controls.target.copy(g.target); camera.lookAt(g.target);
    controls.maxDistance = g.dist * 2.6; controls.update();
    camera.updateMatrixWorld();
    renderer.render(scene, camera);
    setProgress(1, 'Ready');
    requestRender();
    window.__ready = true; $('#loadErr').hidden = true;
    window.__loadMs = performance.now() - t0;
    window.__app = {
      S, parts, cardIdx, selectCard, clearSelection, setSheet, setRegion, camera, controls, scene, renderer, pickAt, pickables, resetView, frameRegion, setLabels,
      get lastPick() { return lastPick; }, get tweening() { return tweens.length > 0 || !!cameraTween; }, get sheetState() { return sheetState; }, count: n, THREE, searchCards,
    };
    setTimeout(() => { loadingEl.classList.add('done'); setTimeout(() => { loadingEl.style.display = 'none'; }, 550); }, 150);
    bootDone = true; reg();
  } catch (err) {
    console.error(err);
    const kind = err && err.kind;
    fatal(kind === 'data' ? 'The anatomy data could not be loaded. Check your connection and try again.'
      : kind === 'stall' ? 'Loading stalled. Check your connection and try again.'
      : kind === 'mismatch' ? 'The 3D model and the part list are out of sync, so no parts could be matched. Close the app and reopen it to get the latest version.'
      : 'The 3D model could not be loaded. Check your connection and try again.');
  }
})();

</script>
<script>
// Classic-script safety net: runs even when the module graph (three.js from the CDN) cannot load or execute.
(function () {
  var m = document.getElementById('main');
  function bail(msg, title, noRetry) {
    if (window.__ready || window.__fatal) return;
    document.getElementById('loadBar').hidden = true; document.getElementById('loadMsg').hidden = true;
    document.getElementById('loadPct').hidden = true;
    var box = document.getElementById('loadErr');
    box.hidden = false;
    if (title) box.getElementsByTagName('h1')[0].textContent = title;
    if (noRetry) box.getElementsByTagName('button')[0].hidden = true;
    document.getElementById('loadErrMsg').textContent = msg || 'The 3D engine could not be downloaded. Check your internet connection and try again.';
  }
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
    bail('This app needs iOS 16.4 or later.', 'Update required', true);
    return;
  }
  m.addEventListener('error', function () { bail(); });
  window.addEventListener('error', function (e) {
    if (window.__ready || window.__fatal) return;
    if (e && /ResizeObserver/.test(String(e.message))) return;
    bail();
  });
  setTimeout(function () { if (!window.__ready && !window.__fatal) bail(); }, 180000);
})();
</script>
