<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anatomy 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive 3D anatomy of the right upper limb.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anatomy 3D">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<style>
:root{
  color-scheme: dark light;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --accent: #0a84ff;
  --bg1: #1a2030; --bg2: #090b10;
  --text: #f4f6fb; --text2: rgba(236,241,252,.66); --text3: rgba(236,241,252,.42);
  --glass: rgba(30,33,42,.64); --glass-solid: #1b1e27; --lbl-bg: rgba(27,30,39,.88);
  --glass-border: rgba(255,255,255,.11);
  --fill: rgba(255,255,255,.10); --fill-hi: rgba(255,255,255,.17);
  --track: rgba(255,255,255,.18);
  --shadow: 0 10px 34px rgba(0,0,0,.45);
  --good: #30d158; --bad: #ff453a;
  --peek-h: calc(66px + var(--safe-b));
  --dock-bottom: max(8px, var(--safe-b));
  --quiz-h: 0px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg1: #fbfcfe; --bg2: #dfe4ee;
    --text: #12151c; --text2: rgba(18,21,28,.62); --text3: rgba(18,21,28,.4);
    --glass: rgba(255,255,255,.7); --glass-solid: #ffffff; --lbl-bg: rgba(255,255,255,.9);
    --glass-border: rgba(0,0,0,.08);
    --fill: rgba(0,0,0,.055); --fill-hi: rgba(0,0,0,.1);
    --track: rgba(0,0,0,.14);
    --shadow: 0 10px 34px rgba(20,30,60,.16);
    --accent: #007aff;
    --good: #1f9d45; --bad: #e0332a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0d12}
body{
  position:fixed;inset:0;font:15px/1.35 var(--font);color:var(--text);
  background:radial-gradient(120% 90% at 50% 30%, var(--bg1) 0%, var(--bg2) 100%);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl{position:absolute;left:0;top:0;max-width:130px;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);
  background:var(--lbl-bg);
  border:.5px solid var(--glass-border);will-change:transform}
.lbl.sel{background:var(--accent);color:#fff;border-color:transparent;z-index:1}
.lbl i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* Light mode + black-translucent status bar = white status text, so give the very top a soft dark scrim */
.scrim-top{position:fixed;left:0;right:0;top:0;height:calc(var(--safe-t) + 4px);pointer-events:none;z-index:3;
  background:linear-gradient(rgba(10,12,18,.5),rgba(10,12,18,0));display:none}
@media (prefers-color-scheme: light){ .scrim-top{display:block} }

.glass{
  background:var(--glass);border:.5px solid var(--glass-border);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);
}

/* ---------- top bar ---------- */
#topbar{position:fixed;z-index:10;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + 8px);
  display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;height:48px;border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;color:var(--text2)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;
  -webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--text3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.round:active,.btn:active,.chip:active,.rail-btn:active{transform:scale(.95)}
.clear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
body.quiz #topbar,body.quiz #results{display:none}

#results{position:fixed;z-index:11;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + 64px);
  max-height:min(56vh, calc(100dvh - var(--safe-t) - 90px));overflow:auto;border-radius:20px;padding:6px;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.res{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 12px;border-radius:14px;text-align:left}
.res:active,.res.hl{background:var(--fill)}
.res .dot{width:10px;height:10px;border-radius:50%;flex:none}
.res .t{flex:1;min-width:0}
.res .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .s{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .off{font-size:11px;color:var(--text3);flex:none}
.empty{padding:22px 12px;text-align:center;color:var(--text2)}

/* ---------- right rail ---------- */
#rail{position:fixed;z-index:8;right:calc(10px + var(--safe-r));top:calc(var(--safe-t) + 70px);display:flex;flex-direction:column;gap:8px}
.rail-btn{width:54px;height:54px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--text)}
body.quiz #rail .hide-quiz{display:none}
body.quiz #rail{top:calc(var(--safe-t) + 12px)}

/* ---------- dock ---------- */
#dock{position:fixed;z-index:9;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:var(--dock-bottom);
  max-width:640px;margin:0 auto;border-radius:26px;padding:2px 10px 10px;transition:bottom .35s cubic-bezier(.2,.8,.2,1),opacity .2s,transform .3s}
#dock.away{opacity:0;pointer-events:none;transform:translateY(24px)}
#dockToggle{display:flex;align-items:center;justify-content:center;width:100%;height:26px;color:var(--text3)}
#dockToggle svg{width:20px;height:20px;transition:transform .25s}
#dock.collapsed #dockToggle svg{transform:rotate(180deg)}
#dock.collapsed{padding-bottom:0}
#dock.collapsed .rows{display:none}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.chips{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -10px;padding:0 10px;touch-action:pan-x;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip,.btn{height:44px;border-radius:22px;padding:0 15px;display:inline-flex;align-items:center;gap:7px;flex:none;
  background:var(--fill);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .12s,color .15s}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="false"]{color:var(--text3)}
.chip[aria-pressed="false"] .dot{background:transparent !important;box-shadow:inset 0 0 0 1.5px var(--text3)}
.chip[aria-pressed="true"]{background:var(--fill-hi)}
.btn[aria-pressed="true"],.btn.primary{background:var(--accent);color:#fff}
.btn.sq{padding:0;width:44px;justify-content:center}
.stepper{display:inline-flex;align-items:center;height:44px;border-radius:22px;background:var(--fill);flex:none}
.stepper button{width:42px;height:44px;display:grid;place-items:center;border-radius:22px}
.stepper button:disabled{opacity:.3}
.stepper span{font-weight:600;font-size:14px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.expl{min-width:112px;justify-content:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;background:transparent;touch-action:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat, var(--track)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pct{width:40px;text-align:right;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.sp{flex:1}
body.quiz #dock{bottom:calc(var(--dock-bottom) + var(--quiz-h) + 8px)}
body.quiz #dock .row-b,body.quiz #dock .row-c,body.quiz #dockToggle{display:none}
body.quiz #dock{padding-top:10px}

/* ---------- bottom sheet ---------- */
#sheet{position:fixed;z-index:12;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;height:700px;transform:translateY(110%);
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .38s cubic-bezier(.2,.85,.25,1);will-change:transform;pointer-events:none;
  background:var(--glass);border:.5px solid var(--glass-border);border-bottom:0;box-shadow:0 -8px 40px rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8)}
#sheet.open{pointer-events:auto}
#sheet.dragging{transition:none}
#sheetHead{flex:none;padding:6px max(12px, var(--safe-r)) 0 max(12px, var(--safe-l));touch-action:none;cursor:grab}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:0 auto 4px;opacity:.7}
.hrow{display:flex;align-items:center;gap:4px;min-height:48px}
.hrow .tt{flex:1;min-width:0;padding:0 4px}
.hrow h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.latin{font-style:italic;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2);flex:none}
.nav:active{background:var(--fill)}
#sheet:not([data-state="peek"]) h2,#sheet:not([data-state="peek"]) .latin{white-space:normal;overflow:visible;text-overflow:clip}
#sheet[data-state="peek"] .latin,#sheet[data-state="peek"] #sChips{display:none}
#sheet[data-state="peek"] #sPrev,#sheet[data-state="peek"] #sNext{display:none}
#sChips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--fill);font-size:12px;font-weight:600;color:var(--text2)}
.tag .dot{width:8px;height:8px;border-radius:50%}
#sheetBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  padding:4px max(18px, var(--safe-r)) calc(24px + var(--safe-b) + var(--hide,0px)) max(18px, var(--safe-l));-webkit-user-select:text;user-select:text}
.summary{font-size:15.5px;line-height:1.45;margin:4px 0 12px}
.field{margin:0 0 14px}
.field h4{margin:0 0 3px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.field p{margin:0;font-size:15px}
.field ul{margin:0;padding-left:18px}
.field li{margin:1px 0}
.clin{background:var(--fill);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.clin h4{color:var(--accent)}
.clin p{margin:0}
.soon{padding:14px;border-radius:14px;background:var(--fill);color:var(--text2);text-align:center;margin-top:6px}

/* ---------- quiz ---------- */
#quiz{position:fixed;z-index:9;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:var(--dock-bottom);max-width:640px;margin:0 auto;
  border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--fill);border-radius:22px;padding:3px;flex:1}
.seg button{flex:1;height:38px;border-radius:19px;font-weight:600;font-size:14px;color:var(--text2)}
.seg button[aria-selected="true"]{background:var(--glass-solid);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.score{font-weight:700;font-size:14px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.qprompt{font-size:13px;color:var(--text2)}
.qname{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.qhint:empty,#qfb:empty{display:none}
.qhint{font-size:13.5px;font-style:italic;color:var(--text2);margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:50px;padding:8px 10px;border-radius:16px;background:var(--fill);font-weight:600;font-size:14px;line-height:1.2;text-align:center}
.opt.good{background:var(--good);color:#fff}
.opt.bad{background:var(--bad);color:#fff}
.opt:disabled:not(.good):not(.bad){opacity:.5}
#qfb{font-weight:700}
#qfb.good{color:var(--good)} #qfb.bad{color:var(--bad)}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.mcard{width:100%;max-width:680px;height:calc(100dvh - var(--safe-t) - 36px);border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.85,.25,1);
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:.5px solid var(--glass-border);border-bottom:0}
.modal.open .mcard{transform:none}
#mInfo .mcard{height:auto;max-height:calc(100dvh - var(--safe-t) - 36px)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px max(10px, var(--safe-r)) 4px max(20px, var(--safe-l))}
.mhead h3{margin:0;font-size:20px;font-weight:700}
.mbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(20px, var(--safe-r)) calc(24px + var(--safe-b)) max(20px, var(--safe-l));-webkit-user-select:text;user-select:text}
.gsearch{margin:6px max(16px, var(--safe-r)) 8px max(16px, var(--safe-l));height:44px;border-radius:22px;background:var(--fill);display:flex;align-items:center;padding:0 14px;gap:8px;color:var(--text2)}
.gsearch input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.term{padding:10px 0;border-bottom:.5px solid var(--glass-border)}
.term b{display:block;font-size:15.5px}
.term span{color:var(--text2);font-size:14.5px}
.mbody p{margin:0 0 12px}
.warn{padding:12px 14px;border-radius:14px;background:var(--fill);font-weight:600}
.small{font-size:13px;color:var(--text2)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px max(30px, var(--safe-r)) 30px max(30px, var(--safe-l));text-align:center;
  background:radial-gradient(120% 90% at 50% 30%, var(--bg1) 0%, var(--bg2) 100%);transition:opacity .45s}
#loading.done{opacity:0;pointer-events:none}
#loading h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
#loading .bar{width:min(260px,70vw);height:6px;border-radius:3px;background:var(--track);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s}
#loading .bar.ind i{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
#loadMsg{color:var(--text2);font-size:14px;min-height:20px}
#loadErr{max-width:320px}
#loadErr p{color:var(--text2);margin:8px 0 14px}
#loadErr .btn{margin:0 auto}
.arm-logo{width:64px;height:64px;color:var(--accent);opacity:.9}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;animation-duration:.01ms !important} }
@media (min-width: 700px){ #dock,#quiz{max-width:560px} }
</style>
</head>
<body>
<canvas id="c" aria-label="3D model of the right upper limb"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="scrim-top"></div>

<header id="topbar">
  <div class="search glass">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search parts" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search parts">
    <button id="qclear" class="clear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
  </div>
  <button id="btnGloss" class="round glass" aria-label="Glossary"><svg class="i" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7.5h7M8 11h5"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg></button>
  <button id="btnInfo" class="round glass" aria-label="About and credits"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".7" fill="currentColor"/></svg></button>
</header>
<div id="results" class="glass" hidden></div>

<nav id="rail" aria-label="View">
  <button id="btnReset" class="rail-btn glass hide-quiz" aria-label="Reset view"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/></svg>Reset</button>
  <button id="btnQuiz" class="rail-btn glass hide-quiz" aria-label="Start quiz"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7"/><circle cx="12" cy="16.9" r=".7" fill="currentColor"/></svg>Quiz</button>
</nav>

<section id="dock" class="glass" aria-label="Controls">
  <button id="dockToggle" aria-label="Show or hide controls" aria-expanded="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg></button>
  <div class="rows">
    <div class="row chips" id="chips" role="group" aria-label="Layers"></div>
    <div class="row row-b">
      <button id="btnExplode" class="btn expl"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v5M9.5 5.5L12 3l2.5 2.5M12 21v-5M9.5 18.5L12 21l2.5-2.5M3 12h5M5.5 9.5L3 12l2.5 2.5M21 12h-5M18.5 9.5L21 12l-2.5 2.5"/></svg><span>Explode</span></button>
      <input id="explode" type="range" min="0" max="100" value="0" step="1" aria-label="Explode amount">
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="row row-c">
      <div class="stepper" role="group" aria-label="Peel muscle layers">
        <button id="peelMinus" aria-label="Restore layer"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <span id="peelLbl">Peel 0/3</span>

<!-- Bootstrap safety net: shows a friendly message if the module graph (CDN) fails to load at all. -->
<script type="module" id="main">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ------------------------------------------------------------------ constants */
const TYPE_COLOR = { bone: '#e8dfc8', muscle: '#b3323a', nerve: '#f2c94c', artery: '#e03a4a', vein: '#3b7ddd' };
const TYPE_LABEL = { bone: 'Bone', muscle: 'Muscle', nerve: 'Nerve', artery: 'Artery', vein: 'Vein' };
const LAYER_LABEL = { bone: 'Bone', muscle_deep: 'Deep muscle', muscle_mid: 'Middle muscle', muscle_superficial: 'Superficial muscle', nerve: 'Nerve', artery: 'Artery', vein: 'Vein' };
const CHIPS = [
  ['bone', 'Bone', '#e8dfc8'], ['muscle_deep', 'Deep muscle', '#8e2630'], ['muscle_mid', 'Middle muscle', '#b3323a'],
  ['muscle_superficial', 'Superficial muscle', '#cf4a4f'], ['tendon', 'Tendons', '#f1ece0'], ['nerve', 'Nerves', '#f2c94c'],
  ['artery', 'Arteries', '#e03a4a'], ['vein', 'Veins', '#3b7ddd'],
];
const PEEL_ORDER = ['muscle_superficial', 'muscle_mid', 'muscle_deep'];
const EXPLODE_K = 1.0;
const MAT_DEFS = {
  Bone:      { color: 0xe9e0c9, roughness: .62 },
  Cartilage: { color: 0xb4c4d3, roughness: .45 },
  Muscle:    { color: 0x9c2a30, roughness: .56 },
  Tendon:    { color: 0xf2eee3, roughness: .32 },
  Nerve:     { color: 0xf4cb4a, roughness: .5 },
  Artery:    { color: 0xd8283f, roughness: .42 },
  Vein:      { color: 0x2f6fd2, roughness: .42 },
};
const HL = {
  sel:  { emissive: 0xffffff, intensity: .38 },
  good: { emissive: 0x20c060, intensity: .7 },
  bad:  { emissive: 0xff3b30, intensity: .7 },
};

/* ------------------------------------------------------------------ state */
const S = {
  layers: { bone: true, muscle_deep: true, muscle_mid: true, muscle_superficial: true, tendon: true, nerve: true, artery: true, vein: true },
  isolate: false, labels: false, selected: null, explode: 0, explodeTarget: 0, hl: new Map(), quizGhost: false,

let parts = [], partsById = new Map(), partsByMesh = new Map(), anatomy = null;

/* ------------------------------------------------------------------ loading UI */
const loadingEl = $('#loading'), loadBar = $('#loadBar'), loadFill = $('#loadFill'), loadMsg = $('#loadMsg');
function setProgress(frac, msg) {
  if (msg) loadMsg.textContent = msg;
  if (frac == null) { loadBar.classList.add('ind'); return; }
  loadBar.classList.remove('ind'); loadFill.style.width = Math.round(clamp(frac, 0, 1) * 100) + '%';
}
function fatal(msg) {
  loadingEl.classList.remove('done'); loadingEl.style.display = 'flex';
  loadBar.hidden = true; loadMsg.hidden = true; $('#loadErr').hidden = false;
  if (msg) $('#loadErrMsg').textContent = msg;
}
window.__fatal = fatal;

/* ------------------------------------------------------------------ renderer / scene */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {

}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 30);
scene.add(camera);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8b93a8, 1.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(1.2, 1.4, 1.6); key.target.position.set(0, 0, -3);
camera.add(key, key.target);
const fill = new THREE.DirectionalLight(0xc6d4ff, 0.75);
fill.position.set(-1.5, -.4, 1.0); fill.target.position.set(0, 0, -3);
camera.add(fill, fill.target);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.085;
controls.rotateSpeed = .85; controls.zoomSpeed = .9; controls.panSpeed = .9;
controls.screenSpacePanning = true; controls.minDistance = 0.1; controls.maxDistance = 6;
controls.addEventListener('change', requestRender);
controls.addEventListener('start', () => cancelCameraTween(true));

let W = innerWidth, H = innerHeight;
let home = { dist: 1.5, target: new THREE.Vector3() };

/* ------------------------------------------------------------------ materials */
const matCache = new Map();
function getMat(kind, name) {
  const k = kind + '|' + name;
  let m = matCache.get(k);
  if (m) return m;
  const d = MAT_DEFS[name] || MAT_DEFS.Muscle;
  if (kind === 'base') {
    m = new THREE.MeshStandardMaterial({ color: d.color, roughness: d.roughness, metalness: 0, side: THREE.DoubleSide });
  } else if (kind === 'ghost') {
    m = new THREE.MeshStandardMaterial({ color: d.color, roughness: d.roughness, metalness: 0, transparent: true, opacity: .12, depthWrite: false });
  } else {
    const h = HL[kind];
    m = new THREE.MeshStandardMaterial({ color: d.color, roughness: d.roughness, metalness: 0, side: THREE.DoubleSide, emissive: h.emissive, emissiveIntensity: h.intensity });
  }
  m.name = name; matCache.set(k, m); return m;
}

/* ------------------------------------------------------------------ helpers: names */
const cleanName = s => String(s || '').replace(/\.(r|l|g)$/i, '').trim();
const partTitle = p => (p.card && p.card.name) || cleanName(p.label);
const groupLeaf = p => { const g = (p.group || '').split('>').map(x => cleanName(x)).filter(Boolean); return g[g.length - 1] || ''; };
const toList = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);
const fmt = v => (v && typeof v === 'object') ? (v.name || v.label || v.text || JSON.stringify(v)) : String(v);

/* ------------------------------------------------------------------ render loop */
let raf = 0, lastT = 0, tweens = [], cameraTween = null, _selPulseOn = false, viewShift = 0, viewShiftTarget = 0;
function requestRender() { if (!raf) raf = requestAnimationFrame(frame); }
function tween(dur, fn, done) {
  if (reduceMotion) dur = 0;
  const t = { t0: performance.now(), dur, fn, done, dead: false };

}
// Stop the active camera tween (user drag or a newer camera move). callDone also fires its completion callback.
function cancelCameraTween(callDone) {
  const t = cameraTween; cameraTween = null;
  if (!t || t.dead) return;
  t.dead = true;

  if (callDone && t.done) t.done();
}
const sheetEl = $('#sheet');

function explodeOffset(p, t, out) {
  const m = t * EXPLODE_K * (0.035 * p.tier + 0.6 * p.radial);
  return out.set(p.dir[0] * m, p.dir[1] * m, p.dir[2] * m);
}
const _v = new THREE.Vector3();
function applyExplode() {
  const t = S.explode;
  for (const p of parts) {
    explodeOffset(p, t, _v);
    p.node.position.copy(p.basePos).add(_v);
  }
}
function applyViewOffset() {
  if (Math.abs(viewShift) < 0.4) camera.clearViewOffset();
  else camera.setViewOffset(W, H, 0, viewShift, W, H);
}

function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - (lastT || now)) / 1000 || .016); lastT = now;
  let busy = false;

  // explode smoothing
  const dE = S.explodeTarget - S.explode;
  if (Math.abs(dE) > 0.0004) {
    S.explode = reduceMotion ? S.explodeTarget : S.explode + dE * (1 - Math.exp(-dt * 11));
    if (Math.abs(S.explodeTarget - S.explode) < 0.0006) S.explode = S.explodeTarget;
    applyExplode(); syncExplodeUI(); busy = true;
  }
  // view shift smoothing
  const dV = viewShiftTarget - viewShift;
  if (Math.abs(dV) > 0.3) { viewShift += dV * (1 - Math.exp(-dt * 9)); applyViewOffset(); busy = true; }
  else if (dV !== 0) { viewShift = viewShiftTarget; applyViewOffset(); }
  // tweens
  if (tweens.length) {
    const cur = tweens; tweens = []; // tweens started from callbacks land in the fresh array
    for (const tw of cur) {
      if (tw.dead) continue;
      const k = tw.dur <= 0 ? 1 : clamp((now - tw.t0) / tw.dur, 0, 1);
      tw.fn(ease(k));
      if (k < 1) { if (!tw.dead) tweens.push(tw); }
      else { if (cameraTween === tw) cameraTween = null; tw.dead = true; if (tw.done) tw.done(); }
    }
    busy = true;
  }
  // pulse the selection highlight (only while a part is selected)
  const pulsing = !!S.selected && !reduceMotion;
  if (pulsing || _selPulseOn) {
    const v = pulsing ? .375 + .125 * Math.sin(now / 1200 * Math.PI * 2) : HL.sel.intensity;
    for (const n in MAT_DEFS) getMat('sel', n).emissiveIntensity = v;
    _selPulseOn = pulsing; if (pulsing) busy = true;
  }
  controls.update();
  renderer.render(scene, camera);
  if (S.labels) updateLabels();
  if (busy) requestRender();
}

function onResize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  measureUI(); layoutSheet(false); computeShift(true); applyViewOffset(); requestRender();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { requestRender(); requestAnimationFrame(requestRender); } });
addEventListener('pageshow', () => requestRender());
renderer.domElement.addEventListener('webglcontextlost', e => e.preventDefault());
renderer.domElement.addEventListener('webglcontextrestored', () => { requestRender(); requestAnimationFrame(requestRender); });

/* ------------------------------------------------------------------ UI measurements */
const probeB = el('div'), probeT = el('div'), probePeek = el('div');
for (const p of [probeB, probeT, probePeek]) { p.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none'; document.body.append(p); }
probeB.style.height = 'var(--safe-b)'; probeT.style.height = 'var(--safe-t)'; probePeek.style.height = 'var(--peek-h)';
let safeB = 0, safeT = 0, peekH = 72, halfH = 400, fullH = 700;
function measureUI() {
  safeB = probeB.offsetHeight; safeT = probeT.offsetHeight; peekH = probePeek.offsetHeight || 72;
  halfH = Math.round(H * 0.5); fullH = Math.round(H - safeT - 16);
  sheetEl.style.height = fullH + 'px';
}

/* ------------------------------------------------------------------ framing / view shift */
const dock = $('#dock'), quizEl = $('#quiz');
function bottomOccupied() {
  const dockBase = Math.max(8, safeB);
  if (Q.active) return dockBase + quizEl.offsetHeight + 8 + dock.offsetHeight + 8;
  if (sheetState === 'half' || sheetState === 'full') return snapH(sheetState);
  if (sheetState === 'peek') return peekH + 8 + dock.offsetHeight + 8;
  return dockBase + dock.offsetHeight + 8;
}
function topOccupied() { return Q.active ? safeT + 8 : safeT + 64; }
function computeShift(instant) {
  viewShiftTarget = (bottomOccupied() - topOccupied()) / 2;
  if (instant) viewShift = viewShiftTarget;
  requestRender();
}
function fitDistance(size, bottomOcc, topOcc) {
  const availH = Math.max(200, H - topOcc - bottomOcc);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dV = (size.y / 2 * 1.04 + size.z / 4) / tanV * (H / availH);
  const dH = (Math.max(size.x, size.z) / 2 * 1.15 + size.z / 2) / (tanV * camera.aspect);
  return Math.max(dV, dH);
}

/* ------------------------------------------------------------------ model load */
async function loadModel() {
  setProgress(null, 'Loading model');
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
  const annP = fetch('./anatomy.json').then(r => { if (!r.ok) throw new Error('anatomy.json ' + r.status); return r.json(); })
    .catch(e => { throw Object.assign(new Error(String(e && e.message)), { kind: 'data' }); });
  annP.catch(() => {}); // handled below; avoids an unhandled-rejection report if the model fails first
  const gltf = await new Promise((res, rej) => loader.load('./arm.glb', res, ev => {
    if (ev.lengthComputable && ev.total > 0) setProgress(ev.loaded / ev.total * .92, 'Loading model ' + Math.round(ev.loaded / ev.total * 100) + '%');
    else setProgress(null, 'Loading model ' + (ev.loaded / 1048576).toFixed(1) + ' MB');
  }, e => rej(Object.assign(new Error(String(e && e.message)), { kind: 'model' }))));
  setProgress(.94, 'Loading anatomy data');
  anatomy = await annP;
  setProgress(.97, 'Preparing');
  draco.dispose();
  await new Promise(r => setTimeout(r, 0));

  const root = gltf.scene;
  pivot.add(root);
  const all = new THREE.Box3().setFromObject(root);
  const c = all.getCenter(new THREE.Vector3());
  root.position.sub(c);
  root.updateMatrixWorld(true);

  const san = n => n.replace(/\s/g, '_').replace(/[\[\]\.:\/]/g, '');
  const byName = new Map();
  for (const p of anatomy.parts) { byName.set(p.mesh, p); byName.set(san(p.mesh), p); }
  const nodesFound = new Map();
  root.traverse(o => {
    const n = (o.userData && o.userData.name) || o.name;
    if (!n) return;
    const p = byName.get(n) || byName.get(san(n)) || byName.get(o.name);
    if (p && !nodesFound.has(p.id) && (o.isMesh || o.isGroup || o.children.length || o.isObject3D)) {
      // prefer the outermost object carrying the part's name that actually contains meshes
      let has = false; o.traverse(m => { if (m.isMesh) has = true; });
      if (has) nodesFound.set(p.id, o);
    }
  });

  const box = new THREE.Box3(), sz = new THREE.Vector3(), ctr = new THREE.Vector3();
  let missing = 0;
  for (const d of anatomy.parts) {
    const node = nodesFound.get(d.id);
    if (!node) { missing++; continue; }
    const meshes = []; node.traverse(m => { if (m.isMesh) meshes.push(m); });
    const part = Object.assign({}, d, {
      node, meshes, tendonMeshes: [], basePos: node.position.clone(), tier: d.tier || 0, radial: d.radial || 0,
      dir: d.dir || [0, 0, 1], card: d.card || null,
    });
    part.title = partTitle(part);
    for (const m of meshes) {
      const mn = (m.material && m.material.name) || 'Muscle';
      m.userData.matName = MAT_DEFS[mn] ? mn : 'Muscle';
      m.userData.part = part;
      m.material = getMat('base', m.userData.matName);
      m.matrixAutoUpdate = true;
      if (m.userData.matName === 'Tendon') part.tendonMeshes.push(m);
    }
    box.setFromObject(node); box.getCenter(ctr); box.getSize(sz);
    part.c0 = ctr.clone(); part.radius = Math.max(.004, sz.length() / 2);
    part.sort = part.title;
    parts.push(part); partsById.set(part.id, part); partsByMesh.set(part.mesh, part);
  }
  if (missing) console.warn('Parts missing from glb:', missing);
  if (!parts.length) throw Object.assign(new Error('No parts in the 3D model matched the part list.'), { kind: 'mismatch' });
  home.target.set(0, 0, 0);
  return all.getSize(new THREE.Vector3());
}

/* ------------------------------------------------------------------ appearance */
function setHighlights(map) { S.hl = map; refreshAppearance(); }
function refreshAppearance() {
  const hl = new Map(S.hl);
  if (S.selected && !hl.has(S.selected.id)) hl.set(S.selected.id, 'sel');
  const ghostOthers = hl.size > 0 && (S.isolate || S.quizGhost);
  for (const p of parts) {
    const kind = hl.get(p.id) || (ghostOthers ? 'ghost' : 'base');
    if (p._kind === kind) continue;
    p._kind = kind;
    for (const m of p.meshes) m.material = getMat(kind, m.userData.matName);
    p.node.traverse(m => { if (m.isMesh) m.renderOrder = kind === 'ghost' ? 1 : 0; });
  }
  requestRender();
}
function partVisible(p) { return !!S.layers[p.layer]; }
function applyVisibility() {
  for (const p of parts) {
    const on = !!S.layers[p.layer];
    p.node.visible = on;
    for (const m of p.tendonMeshes) m.visible = S.layers.tendon;
  }
  if (S.selected && !partVisible(S.selected)) clearSelection();
  updateChips(); updatePeel();
  if (Q.active && Q.cur && !Q.answered && !partVisible(Q.cur)) nextQuestion();
  requestRender();
}

/* ------------------------------------------------------------------ layer chips + peel */
const chipsEl = $('#chips');
for (const [id, label, color] of CHIPS) {
  const b = el('button', 'chip'); b.dataset.layer = id; b.setAttribute('aria-pressed', 'true');
  const d = el('span', 'dot'); d.style.background = color; b.append(d, document.createTextNode(label));
  b.addEventListener('click', () => { S.layers[id] = !S.layers[id]; applyVisibility(); });
  chipsEl.append(b);
}
function updateChips() { for (const b of $$('.chip', chipsEl)) b.setAttribute('aria-pressed', String(!!S.layers[b.dataset.layer])); }
function peelLevel() { let n = 0; for (const l of PEEL_ORDER) { if (!S.layers[l]) n++; else break; } return n; }
function updatePeel() {
  const n = peelLevel();
  $('#peelLbl').textContent = 'Peel ' + n + '/3';
  $('#peelMinus').disabled = n === 0;
}
$('#peelPlus').addEventListener('click', () => {
  const n = peelLevel();
  if (n >= 3) { for (const l of PEEL_ORDER) S.layers[l] = true; }
  else S.layers[PEEL_ORDER[n]] = false;
  applyVisibility();
});
$('#peelMinus').addEventListener('click', () => {
  const n = peelLevel(); if (n > 0) { S.layers[PEEL_ORDER[n - 1]] = true; applyVisibility(); }
});

/* ------------------------------------------------------------------ explode UI */
const slider = $('#explode'), pct = $('#pct'), btnExplode = $('#btnExplode');

  let q = p.card && p.card.quiz;
  if (Array.isArray(q)) q = q[Math.floor(Math.random() * q.length)];
  if (q && typeof q === 'object') q = q.hint || q.question || q.prompt || q.clue || q.q || '';
  return q ? String(q) : '';
}
function startQuiz() {
  closeResults(true);
  if (S.selected) { S.selected = null; setSheet('hidden'); }
  Q.active = true; Q.score = 0; Q.total = 0; Q.queue = []; Q.savedLabels = S.labels; Q.savedIso = S.isolate;
  setLabels(false); S.isolate = false; $('#btnIso').setAttribute('aria-pressed', 'false');
  document.body.classList.add('quiz'); quizEl.hidden = false; setDockCollapsed(false);
  dock.classList.remove('away');
  document.documentElement.style.setProperty('--dock-bottom', 'max(8px, var(--safe-b))');
  if (Q.mode === 'find') beginFind(); else nextQuestion();
}
function beginFind() {
  // show the card first, then frame the whole arm above it, then pick a question that is tappable from that view
  $('#qprompt').textContent = 'Get ready'; $('#qname').textContent = ''; $('#qhint').textContent = ''; $('#qopts').hidden = true;
  $('#qnext').hidden = true; $('#qskip').hidden = true; $('#qfb').textContent = ''; S.hl = new Map(); refreshAppearance();
  requestAnimationFrame(() => {
    document.documentElement.style.setProperty('--quiz-h', quizEl.offsetHeight + 'px'); computeShift(true);
    const d = fitDistance(modelSize, bottomOccupied(), topOccupied());
    tweenCamera(home.target.clone(), d, new THREE.Vector3(0, 0, 1), () => { if (Q.active && Q.mode === 'find') nextQuestion(); });
  });
}
function exitQuiz() {
  Q.active = false; Q.cur = null; S.quizGhost = false; S.hl = new Map();
  document.body.classList.remove('quiz'); quizEl.hidden = true;
  document.documentElement.style.setProperty('--quiz-h', '0px');
  S.isolate = !!Q.savedIso; $('#btnIso').setAttribute('aria-pressed', String(S.isolate));
  setLabels(Q.savedLabels); refreshAppearance(); computeShift(false);
  tweenCamera(home.target.clone(), home.dist, new THREE.Vector3(0, 0, 1));
}
function setQuizMode(m) {
  Q.mode = m; Q.score = 0; Q.total = 0;   $('#qmFind').setAttribute('aria-selected', String(m === 'find'));
  $('#qmName').setAttribute('aria-selected', String(m === 'name'));
  if (m === 'find') beginFind(); else nextQuestion();
}
function updateScore() { $('#qscore').textContent = Q.score + ' / ' + Q.total; }
function nextQuestion() {
  Q.answered = false; S.quizGhost = false; S.hl = new Map();
  $('#qfb').textContent = ''; $('#qfb').className = ''; $('#qnext').hidden = true; $('#qskip').hidden = false;
  updateScore();
  const pool = eligible();
  const optsEl = $('#qopts');
  if (!pool.length) {
    Q.cur = null; $('#qprompt').textContent = ''; $('#qname').textContent = 'Turn on a layer to start'; $('#qhint').textContent = ''; optsEl.hidden = true;
    refreshAppearance(); return;
  }
  Q.queue = Q.queue.filter(partVisible);
  if (!Q.queue.length) Q.queue = shuffle(pool).filter(p => p !== Q.cur);
  let p = Q.queue.pop();
  if (Q.mode === 'find') { // prefer parts you can actually tap from the current view (bounded raycast budget)
    const t0 = performance.now();
    const ctx = makeRayCtx(), failed = []; let pt = null, found = null, cand = p;
    for (let i = 0; cand && i < 80; i++) {
      pt = exposedPoint(cand, ctx);
      if (pt) { found = cand; break; }
      failed.push(cand);
      if (ctx.left <= 0) break;
      cand = Q.queue.pop();
    }
    if (found) { p = found; Q.queue.unshift(...failed); }   // tested-and-failed parts go to the back of the queue
    else { p = failed[0] || pool[0]; pt = null; Q.queue.unshift(...failed.slice(1)); } // none passed: any visible part
    Q.tapPt = pt; Q.lastPickMs = performance.now() - t0; Q.lastRays = RAYS_PER_QUESTION - ctx.left;
  }
  Q.cur = p;
  if (Q.mode === 'find') {
    $('#qprompt').textContent = 'Tap this part on the model';
    $('#qname').textContent = partTitle(p);
    $('#qhint').textContent = quizHint(p);
    optsEl.hidden = true;
    refreshAppearance();
  } else {
    $('#qprompt').textContent = 'What is the highlighted part?';
    $('#qname').textContent = ''; $('#qhint').textContent = '';
    S.quizGhost = true; S.hl = new Map([[p.id, 'sel']]); refreshAppearance();
    focusPart(p);
    const same = parts.filter(q => q.type === p.type && q !== p);
    const names = new Set([partTitle(p)]); const picks = [];
    for (const q of shuffle(same).sort((a, b) => (b.layer === p.layer) - (a.layer === p.layer) + (Math.random() - .5) * 1.2)) {
      const n = partTitle(q); if (names.has(n)) continue; names.add(n); picks.push(q); if (picks.length >= 3) break;
    }
    const options = shuffle([p, ...picks]);
    optsEl.textContent = ''; optsEl.hidden = false;
    for (const o of options) {
      const b = el('button', 'opt', partTitle(o)); b.dataset.id = o.id;
      b.addEventListener('click', () => answerName(o, b));
      optsEl.append(b);
    }
  }
  requestAnimationFrame(() => { document.documentElement.style.setProperty('--quiz-h', quizEl.offsetHeight + 'px'); computeShift(false); });
}
function finishQuestion(correct, picked) {
  Q.answered = true; Q.total++; if (correct) Q.score++;
  const fb = $('#qfb');
  if (correct) { fb.textContent = 'Correct'; fb.className = 'good'; }
  else { fb.textContent = picked ? 'Not quite. You chose ' + partTitle(picked) + '.' : 'Revealed: ' + partTitle(Q.cur); fb.className = 'bad'; }
  const hl = new Map([[Q.cur.id, 'good']]);
  if (picked && !correct) hl.set(picked.id, 'bad');
  S.hl = hl; S.quizGhost = !correct;
  refreshAppearance();
  if (!correct) focusPart(Q.cur);
  $('#qnext').hidden = false; $('#qskip').hidden = true; updateScore();
  requestAnimationFrame(() => computeShift(false));
}
function quizTap(p) {
  if (Q.mode !== 'find' || Q.answered || !Q.cur || !p) return;
  finishQuestion(p === Q.cur, p === Q.cur ? null : p);
}
function answerName(o, btn) {
  if (Q.answered) return;
  const ok = o === Q.cur;
  for (const b of $$('.opt', $('#qopts'))) { b.disabled = true; if (b.dataset.id === Q.cur.id) b.classList.add('good'); }
  if (!ok) btn.classList.add('bad');
  finishQuestion(ok, ok ? null : o);
}
$('#btnQuiz').addEventListener('click', startQuiz);
$('#qexit').addEventListener('click', exitQuiz);
$('#qmFind').addEventListener('click', () => Q.mode !== 'find' && setQuizMode('find'));
$('#qmName').addEventListener('click', () => Q.mode !== 'name' && setQuizMode('name'));
$('#qnext').addEventListener('click', nextQuestion);
$('#qskip').addEventListener('click', () => {
  if (Q.answered || !Q.cur) return;
  if (Q.mode === 'name') { for (const b of $$('.opt', $('#qopts'))) { b.disabled = true; if (b.dataset.id === Q.cur.id) b.classList.add('good'); } }
  finishQuestion(false, null);
});

/* ------------------------------------------------------------------ modals: glossary + info */
function openModal(id) { const m = $(id); m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); }
function closeModal(m) { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); }
$$('.modal').forEach(m => {
  m.addEventListener('pointerdown', e => { if (e.target === m) closeModal(m); });
  $$('[data-close]', m).forEach(b => b.addEventListener('click', () => closeModal(m)));
});
function renderGlossary() {
  const list = $('#gList'); list.textContent = '';
  const terms = (anatomy && anatomy.glossary) || [];
  if (!terms.length) { list.append(el('div', 'empty', 'No terms yet')); return; }
  const q = norm($('#gq').value);
  const sorted = terms.slice().sort((a, b) => String(a.term).localeCompare(String(b.term)));
  const shown = q ? sorted.filter(t => norm(t.term).includes(q) || norm(t.def).includes(q)) : sorted;
  if (!shown.length) { list.append(el('div', 'empty', 'No matching terms')); return; }
  for (const t of shown) { const d = el('div', 'term'); d.append(el('b', null, t.term), el('span', null, t.def)); list.append(d); }
}
$('#btnGloss').addEventListener('click', () => { renderGlossary(); openModal('#mGloss'); });
$('#gq').addEventListener('input', renderGlossary);
function renderInfo() {
  const b = $('#infoBody'); b.textContent = '';
  b.append(el('p', null, 'Anatomy 3D: an interactive 3D model of the right upper limb with bones, muscles, nerves and vessels.'));
  const cr = el('p'); cr.append(el('b', null, 'Credits')); cr.append(document.createElement('br'));
  cr.append(document.createTextNode((anatomy && anatomy.credit) || 'Credits unavailable.')); b.append(cr);
  b.append(el('div', 'warn', 'For study only. Not for clinical use.'));
  const meta = el('p', 'small'); meta.style.marginTop = '14px';
  meta.textContent = 'Tap a part to select it. Drag to rotate, pinch to zoom, two fingers to pan. Add to Home Screen for the full-screen app.' + (anatomy && anatomy.version ? ' Data version ' + anatomy.version + '.' : '');
  b.append(meta);
}
$('#btnInfo').addEventListener('click', () => { renderInfo(); openModal('#mInfo'); });

/* ------------------------------------------------------------------ boot */
(async function boot() {
  try {
    measureUI();
    onResizeInit();
    const size = await loadModel(); modelSize = size;
    updateChips(); updatePeel(); syncExplodeUI();
    // initial framing: front view, whole arm visible above the control dock
    const expandedOcc = Math.max(8, safeB) + dock.offsetHeight + 8;
    home.dist = fitDistance(size, expandedOcc, topOccupied());
    controls.maxDistance = home.dist * 3.2;
    camera.position.set(0, 0, home.dist); controls.target.set(0, 0, 0); camera.lookAt(0, 0, 0); controls.update();
    viewShift = viewShiftTarget = (expandedOcc - topOccupied()) / 2; applyViewOffset();
    renderer.render(scene, camera);
    setProgress(1, 'Ready');
    requestRender();
    window.__ready = true; $('#loadErr').hidden = true;
    window.__app = { S, parts, partsById, selectPart, clearSelection, setSheet, camera, controls, scene, renderer, startQuiz, setLabels, pickAt, Q, exposedPoint, get sheetState() { return sheetState; } };
    setTimeout(() => { loadingEl.classList.add('done'); setTimeout(() => { loadingEl.style.display = 'none'; }, 500); }, 120);
  } catch (err) {
    console.error(err);
    const kind = err && err.kind;
    fatal(kind === 'data' ? 'The anatomy data could not be loaded. Check your connection and try again.'
      : kind === 'mismatch' ? 'The 3D model and the part list are out of sync, so no parts could be matched. Close the app and reopen it to get the latest version.'
      : 'The 3D model could not be loaded. Check your connection and try again.');
  }
})();
function onResizeInit() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); layoutSheet(false);
}

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
<script>
// Classic-script safety net: runs even when the module graph (three.js from the CDN) cannot load or execute.
(function () {
  var m = document.getElementById('main');
  function bail(msg, title, noRetry) {
    if (window.__ready || window.__fatal) return;
    document.getElementById('loadBar').hidden = true; document.getElementById('loadMsg').hidden = true;
    var box = document.getElementById('loadErr');
    box.hidden = false;
    if (title) box.getElementsByTagName('h1')[0].textContent = title;
    if (noRetry) box.getElementsByTagName('button')[0].hidden = true;
    document.getElementById('loadErrMsg').textContent = msg || 'The 3D engine could not be downloaded. Check your internet connection and try again.';
  }
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
    bail('This app needs iOS 16.4 or later.', 'Update required', true);
    return;
  }
  m.addEventListener('error', function () { bail(); });
  window.addEventListener('error', function (e) {
    if (window.__ready || window.__fatal) return;
    if (e && /ResizeObserver/.test(String(e.message))) return;
    bail();
  });
  setTimeout(function () { if (!window.__ready && !window.__fatal) bail(); }, 40000);
})();
</script>
